name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://falso.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: falsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      # El build de arriba es el de producción: esta suite lo sirve con
      # `next start`. Va antes que la otra porque `next dev` reescribe .next.
      - run: npx playwright test -c playwright.produccion.config.ts
      - if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "== $1"; head -c 3000 "$1"' _ {} \;
      - run: npx playwright test
